name: C++ CI/CD

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt update && sudo apt install -y g++ make

      - name: Compile
        run: g++ -o app 1.cpp

      - name: Run
        run: ./app

  docker-build-deploy:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hello-cpp:latest .

      - name: Stop old container (if running)
        run: docker rm -f hello-cpp || true

      - name: Run new container
        run: docker run -d --name hello-cpp hello-cpp:latest
